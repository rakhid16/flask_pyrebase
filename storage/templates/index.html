<h1>Daftar Gambar Tersimpan</h1>
{% for file_name in data %}

  {{ file_name }}
  <a href="{{ url_for('lihat', file_name=file_name) }}">Lihat</a>
  <a href="{{ url_for('unduh', file_name=file_name) }}">Unduh</a>
  <a href="{{ url_for('hapus', file_name=file_name) }}">Hapus</a><br>

{% endfor %}<br>

<form method="POST" enctype="multipart/form-data">
  <label for="gambar">Unggah gambar baru:</label>
  <input id="gambar" type="file" name="gambar" required><br><br>
  <input type="submit" value="Unggah">
</form>
